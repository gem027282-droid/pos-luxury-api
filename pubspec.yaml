name: luxury_pos
description: "Production-Grade Offline-First Flutter POS with TiDB Cloud Sync and Luxury 2027 UI"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Local Database (Drift / SQLite Offline-First)
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

  # Hardware Integrations
  mobile_scanner: ^5.1.1
  blue_thermal_printer: ^1.2.3

  # Networking & Cloud Sync
  dio: ^5.4.3+1

  # Visual Aesthetics & Utilities
  google_fonts: ^6.2.1
  qr_flutter: ^4.1.0
  intl: ^0.19.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.18.0
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
