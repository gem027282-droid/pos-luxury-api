name: Build Luxury POS (Android APK & iOS IPA)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # 1. Build Android APK
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android APK (Debug / Release)
        run: flutter build apk --debug

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LuxuryPOS-Android-APK
          path: build/app/outputs/flutter-apk/app-debug.apk

  # 2. Build iOS IPA (Requires macOS Runner provided by GitHub)
  build-ios:
    name: Build iOS IPA Package
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS Application (No CodeSign)
        run: flutter build ios --no-codesign

      - name: Package Payload into Installable IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r LuxuryPOS-iOS.ipa Payload
          rm -rf Payload

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LuxuryPOS-iOS-IPA
          path: LuxuryPOS-iOS.ipa
